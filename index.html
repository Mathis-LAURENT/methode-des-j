<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Méthode des J">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Méthode des J</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#4f46e5;--acx:#fff;--ok:#15803d;--okb:#dcfce7;--wn:#b45309;--wnb:#fef3c7;--bd:#e4e2dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--tx:#f1f0ec;--mu:#9a9a94;--ac:#818cf8;--acx:#141416;--ok:#4ade80;--okb:#14301f;--wn:#fbbf24;--wnb:#3a2c0b;--bd:#2f2f35}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--tx:#f1f0ec;--mu:#9a9a94;--ac:#818cf8;--acx:#141416;--ok:#4ade80;--okb:#14301f;--wn:#fbbf24;--wnb:#3a2c0b;--bd:#2f2f35}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:26px;margin:8px 0 2px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:26px 0 8px}
.mu{color:var(--mu);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.card b{font-size:16px}
.ch{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:15px}
.ch:first-of-type{border-top:0}
.tag{font-size:12px;border-radius:99px;padding:3px 9px;background:var(--bd);color:var(--mu);white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}
.tag.wn{background:var(--wnb);color:var(--wn)}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--ac);color:var(--acx);font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button.s{padding:6px 10px;font-size:13px}
button.ok{background:var(--ok);color:var(--acx)}
.btns{display:flex;gap:8px;margin-top:12px}.btns button{flex:1}
input{font:inherit;flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);border-radius:10px}
nav button.on{color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:30px 10px;font-size:15px}
.link{background:none;color:var(--ac);padding:4px 0;font-weight:600}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:12px 0 8px;background:var(--bd)}
.bar i{display:block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.nm{background:#ef4444}.co{background:var(--ac)}.ma{background:var(--ok)}
.tag.nm{background:rgba(239,68,68,.15);color:#ef4444}.tag.co{background:rgba(99,102,241,.18);color:var(--ac)}.tag.ma{background:var(--okb);color:var(--ok)}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-bottom:6px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-a="tab" data-id="today" id="t1">📅 Aujourd’hui</button>
<button data-a="tab" data-id="courses" id="t2">📚 Cours</button>
<button data-a="tab" data-id="stats" id="t3">📊 Progression</button>
</nav>
<script>
const J=[1,3,7,14,30,60];
const KEY="methodeJ.v1";
let S={courses:[]},V={tab:"today",course:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
const today=()=>iso(new Date());
const P=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((P(a)-P(b))/864e5);
const fd=s=>P(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const iv=s=>s<J.length?J[s]:Math.round(J[J.length-1]*Math.pow(1.5,s-J.length+1));
const due=c=>add(c.start,iv(c.step)+c.delay);
const uid=()=>Math.random().toString(36).slice(2,9);
const find=id=>S.courses.find(c=>c.id===id);
function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// Un chapitre en retard est automatiquement décalé à aujourd’hui
function catchUp(){const t=today();S.courses.forEach(co=>co.chapters.forEach(c=>{const d=due(c);if(d&&d<t)c.delay+=diff(t,d)}));save()}

function status(c){return `<span class="tag">J+${iv(c.step)} · ${fd(due(c))}</span>`}
const lvl=c=>c.step<=1?0:c.step<=4?1:2;
const LV=[["Non maîtrisé","nm"],["En consolidation","co"],["Maîtrisé","ma"]];
function vStats(){
  let h=`<h1>Progression</h1><p class="mu">Statut d’apprentissage de vos cours</p><p class="mu" style="margin-top:6px">Non maîtrisé : J+1 à J+3 · En consolidation : J+7 à J+30 · Maîtrisé : J+60 et plus</p>`;
  if(!S.courses.length)return h+`<div class="empty">Aucun cours pour le moment.</div>`;
  S.courses.forEach(co=>{
    const n=co.chapters.length,k=[0,0,0];
    co.chapters.forEach(c=>k[lvl(c)]++);
    h+=`<div class="card"><div class="row"><b>${esc(co.name)}</b>`;
    if(n){const avg=co.chapters.reduce((a,c)=>a+c.step,0)/n,L=avg<2?0:avg<5?1:2;h+=`<span class="tag ${LV[L][1]}">${LV[L][0]}</span>`}
    h+=`</div>`;
    if(!n)h+=`<p class="mu" style="margin-top:6px">Aucun chapitre.</p>`;
    else{
      h+=`<div class="bar">${k.map((v,i)=>v?`<i class="${LV[i][1]}" style="flex:${v}"></i>`:"").join("")}</div>`;
      h+=`<div class="leg">${k.map((v,i)=>`<span class="mu"><i class="dot ${LV[i][1]}"></i>${v} ${LV[i][0].toLowerCase()}</span>`).join("")}</div>`;
      co.chapters.forEach(c=>{const L=lvl(c);h+=`<div class="ch"><span>${esc(c.name)}</span><span class="tag ${LV[L][1]}">${LV[L][0]}</span></div>`});
    }
    h+=`</div>`;
  });
  return h;
}

function vToday(){
  const t=today();
  let h=`<h1>Aujourd’hui</h1><p class="mu">${fd(t)}</p>`;
  const act=S.courses.filter(co=>co.chapters.some(c=>due(c)===t)||co.log[t]);
  h+=`<h2>À réviser</h2>`;
  if(!act.length)h+=`<div class="empty">Rien à réviser aujourd’hui 🎉<br>Ajoutez des chapitres dans l’onglet Cours.</div>`;
  act.forEach(co=>{
    const ch=co.chapters.filter(c=>due(c)===t);
    h+=`<div class="card"><div class="row"><b>${esc(co.name)}</b>`;
    if(co.log[t]==="done")h+=`<span class="tag ok">Révisé ✓</span>`;
    if(co.log[t]==="skip")h+=`<span class="tag wn">Décalé d’un jour</span>`;
    h+=`</div>`;
    ch.forEach(c=>h+=`<div style="padding:10px 0;border-top:1px solid var(--bd)"><div class="row"><span>${esc(c.name)}</span><span class="tag">J+${iv(c.step)}</span></div><p class="mu" style="margin:6px 0">Maîtrisez-vous ce J ?</p><div class="btns" style="margin-top:6px"><button class="ok s" data-a="master" data-id="${co.id}" data-ch="${c.id}">✓ Maîtrisé</button><button class="g s" data-a="redo" data-id="${co.id}" data-ch="${c.id}">↺ À revoir</button></div></div>`);
    if(ch.length)h+=`<div class="btns"><button class="g" data-a="skip" data-id="${co.id}">Pas révisé aujourd’hui (décaler le cours)</button></div>`;
    h+=`</div>`;
  });
  const up=[];
  S.courses.forEach(co=>co.chapters.forEach(c=>{const d=due(c);if(d&&d>t&&diff(d,t)<=7)up.push({d,n:c.name,co:co.name})}));
  up.sort((a,b)=>a.d.localeCompare(b.d));
  if(up.length){h+=`<h2>À venir (7 jours)</h2><div class="card">`;
    up.forEach(u=>h+=`<div class="ch"><span>${esc(u.n)}<br><span class="mu">${esc(u.co)}</span></span><span class="tag">${fd(u.d)}</span></div>`);
    h+=`</div>`}
  return h;
}

function vCourses(){
  let h=`<h1>Mes cours</h1><div class="row" style="margin:14px 0"><input id="nc" placeholder="Nom du cours" maxlength="60"><button data-a="addc">Ajouter</button></div>`;
  if(!S.courses.length)h+=`<div class="empty">Aucun cours pour le moment.</div>`;
  S.courses.forEach(co=>{
    const n=co.chapters.length;
    h+=`<div class="card row" data-a="open" data-id="${co.id}" style="cursor:pointer"><div><b>${esc(co.name)}</b><p class="mu">${n} chapitre${n>1?"s":""}</p></div><span class="mu">›</span></div>`;
  });
  return h;
}

function vCourse(){
  const co=find(V.course);
  if(!co){V.course=null;return vCourses()}
  let h=`<button class="link" data-a="back">‹ Cours</button><h1>${esc(co.name)}</h1>`;
  h+=`<div class="row" style="margin:14px 0"><input id="nch" placeholder="Nouveau chapitre à réviser" maxlength="80"><button data-a="addch" data-id="${co.id}">Ajouter</button></div>`;
  if(!co.chapters.length)h+=`<div class="empty">Ajoutez un chapitre : la 1re révision sera prévue demain (J+1).</div>`;
  else{h+=`<div class="card">`;
    co.chapters.forEach(c=>h+=`<div class="ch"><span>${esc(c.name)}</span><span class="row">${status(c)}<button class="g s" data-a="delch" data-id="${co.id}" data-ch="${c.id}">${V.del===c.id?"Supprimer ?":"✕"}</button></span></div>`);
    h+=`</div>`}
  h+=`<p class="mu" style="margin-top:14px">Calendrier : J+1, J+3, J+7, J+14, J+30, J+60, puis des intervalles toujours plus longs. Un chapitre n’est supprimé que manuellement.</p>`;
  h+=`<div class="btns"><button class="g" data-a="delc" data-id="${co.id}">Supprimer ce cours</button></div>`;
  return h;
}

function render(){
  $("#app").innerHTML=V.tab==="today"?vToday():V.tab==="stats"?vStats():(V.course?vCourse():vCourses());
  $("#t1").className=V.tab==="today"?"on":"";
  $("#t2").className=V.tab==="courses"?"on":"";
  $("#t3").className=V.tab==="stats"?"on":"";
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a,id=el.dataset.id,t=today();
  if(a!=="delch")V.del=null;
  if(a==="tab"){V.tab=id;V.course=null}
  else if(a==="open")V.course=id;
  else if(a==="back")V.course=null;
  else if(a==="addc"){const v=$("#nc").value.trim();if(!v)return;S.courses.push({id:uid(),name:v,chapters:[],log:{}});save()}
  else if(a==="addch"){const v=$("#nch").value.trim();if(!v)return;find(id).chapters.push({id:uid(),name:v,start:t,step:0,delay:0});save()}
  else if(a==="delch"){if(V.del!==el.dataset.ch){V.del=el.dataset.ch;render();return}const co=find(id);co.chapters=co.chapters.filter(c=>c.id!==el.dataset.ch);V.del=null;save()}
  else if(a==="master"){const co=find(id),c=co.chapters.find(x=>x.id===el.dataset.ch);c.step++;co.log[t]="done";save()}
  else if(a==="delc"){S.courses=S.courses.filter(c=>c.id!==id);V.course=null;save()}
  else if(a==="redo"){const co=find(id),c=co.chapters.find(x=>x.id===el.dataset.ch);c.step=0;c.start=t;c.delay=0;co.log[t]="done";save()}
  else if(a==="skip"){const co=find(id);co.chapters.forEach(c=>{c.delay++});co.log[t]="skip";save()}
  render();
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const b=e.target.id==="nc"?document.querySelector('[data-a="addc"]'):e.target.id==="nch"?document.querySelector('[data-a="addch"]'):null;
  if(b)b.click();
});
load();catchUp();render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
